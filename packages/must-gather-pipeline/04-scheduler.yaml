# Scheduled runs, started by a service account instead of a person.
#
# must-gather-scheduler can only create/list PipelineRuns in this namespace - nothing
# else. The runs it starts use the same identities as manual runs (task pods as
# must-gather-tasks, the gather itself as must-gather-runner via the kubeconfig Secret).
#
# The PipelineRun comes from ConfigMap mg-pipelinerun-template (built from
# tekton/pipelinerun-template.yaml by deploy.sh), so scheduled and manual runs are
# identical. Change the schedule/alias here; since=24h in the template matches daily.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: must-gather-scheduler
  namespace: must-gather-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: must-gather-scheduler
  namespace: must-gather-pipelines
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns]
    verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: must-gather-scheduler
  namespace: must-gather-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: must-gather-scheduler
subjects:
  - kind: ServiceAccount
    name: must-gather-scheduler
    namespace: must-gather-pipelines
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: must-gather-daily
  namespace: must-gather-pipelines
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: must-gather-scheduler
          restartPolicy: OnFailure
          containers:
            - name: start-run
              image: quay.io/openshift/origin-cli:4.22
              env:
                - { name: HOME, value: /tmp }
                - { name: CLUSTER_ALIAS, value: okd }
                - { name: UPLOAD, value: "true" }
                - { name: GATHER_TYPE, value: default }
                - { name: INCLUDE_DEFAULT, value: "true" }
                - { name: ARTIFACTORY_URL, value: "http://artifactory.artifactory.svc:8082/artifactory/generic-local/must-gather" }
              command: [/bin/bash, -c]
              args:
                - |
                  set -euo pipefail
                  # don't pile up behind a run that is still going (they share one RWO PVC)
                  running=$(oc get pipelinerun -l tekton.dev/pipeline=sanitised-must-gather \
                    -o jsonpath='{range .items[*]}{.status.conditions[0].status}{"\n"}{end}' | grep -c '^Unknown$' || true)
                  if [ "$running" -gt 0 ]; then echo "a run is still in progress - skipping this slot"; exit 0; fi
                  run_id="$(date -u +%Y%m%d-%H%M%S)"
                  sed -e "s|ARTIFACTORY_URL|$ARTIFACTORY_URL|" -e "s/CLUSTER_ALIAS/$CLUSTER_ALIAS/g" \
                      -e "s/RUN_ID/$run_id/" -e "s/UPLOAD/$UPLOAD/" \
                      -e "s/GATHER_TYPE/$GATHER_TYPE/" -e "s/INCLUDE_DEFAULT/$INCLUDE_DEFAULT/" /template/pipelinerun.yaml \
                    | oc label --local -f - must-gather/trigger=schedule -o yaml \
                    | oc create -f - -o jsonpath='started {.metadata.name}{"\n"}'
                  echo "runId=$run_id alias=$CLUSTER_ALIAS upload=$UPLOAD gatherType=$GATHER_TYPE"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: template, mountPath: /template, readOnly: true }
          volumes:
            - name: template
              configMap:
                name: mg-pipelinerun-template
                items: [{ key: pipelinerun.yaml, path: pipelinerun.yaml }]
