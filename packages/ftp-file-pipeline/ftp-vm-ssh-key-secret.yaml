apiVersion: v1
kind: Secret
metadata:
  name: ftp-vm-ssh-key
  namespace: openshift-pipelines-operator
type: Opaque
data:
  id_rsa: "REPLACE_ME_BASE64"   # Base64-encoded SSH private key with root access to the FTP server VM
  # Generate: ssh-keygen -t rsa -b 4096 -f ftp-vm-key -N ""
  #           cat ftp-vm-key | base64 -w 0
  #           Add ftp-vm-key.pub to root@<ftp-host>:~/.ssh/authorized_keys
