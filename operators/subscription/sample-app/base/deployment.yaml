apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: sample-app
        # image: updated automatically by the sample-app-ci Tekton pipeline after each build
        image: image-registry.openshift-image-registry.svc:5000/sample-app/sample-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: BUILD_VERSION
          value: "latest"
        - name: GREETING
          valueFrom:
            secretKeyRef:
              name: sample-app-credentials
              key: greeting
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
