apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpd-via-artifactory
  namespace: artifactory-pullthrough-test
  labels:
    app: httpd-via-artifactory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpd-via-artifactory
  template:
    metadata:
      labels:
        app: httpd-via-artifactory
    spec:
      imagePullSecrets:
      - name: artifactory-pull-secret
      containers:
      - name: httpd
        image: artifactory-artifactory.apps.okd.funky-bash.com/docker/library/httpd:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-via-artifactory
  namespace: artifactory-pullthrough-test
spec:
  selector:
    app: httpd-via-artifactory
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: httpd-via-artifactory
  namespace: artifactory-pullthrough-test
spec:
  to:
    kind: Service
    name: httpd-via-artifactory
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
