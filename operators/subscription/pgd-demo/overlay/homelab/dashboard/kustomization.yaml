apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace of the Grafana instance (Grafana Operator v5).
namespace: grafana

resources:
  - ../../../dashboard

patches:
  - target:
      kind: GrafanaDashboard
      name: pgd-write-leader-lab
    patch: |-
      - op: replace
        path: /spec/instanceSelector/matchLabels
        value:
          dashboards: cluster-health
