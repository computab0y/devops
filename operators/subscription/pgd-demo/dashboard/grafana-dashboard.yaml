        {
          "type": "stat",
          "id": 2,
          "title": "PGD health",
          "description": "Worst of: PGD's monitoring functions (bdr.monitor_group_raft, bdr.monitor_group_versions, bdr.monitor_local_replslots on every node), node reachability, replication slots and subscriptions, and the EDB operator's Ready condition. 'Open issues' lists what's behind a WARNING or CRITICAL.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(pgd_demo_overall_health{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "HEALTHY",
                      "color": "green",
                      "index": 0
