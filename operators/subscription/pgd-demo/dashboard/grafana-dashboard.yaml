            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "state"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "ACTIVE": {
                            "text": "ACTIVE",
                            "color": "green",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": ".*",
                          "result": {
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "reachable"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "yes",
                            "color": "green",
                            "index": 0
                          },
                          "0": {
                            "text": "NO",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "write"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "WRITE LEADER",
                            "color": "blue",
                            "index": 0
                          },
                          "0": {
                            "text": " ",
                            "color": "transparent",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "raft"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "RAFT LEADER",
                            "color": "purple",
                            "index": 0
                          },
                          "0": {
                            "text": "follower",
                            "color": "text",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "postgres uptime"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dtdurations"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            },
            "sortBy": [
              {
                "displayName": "node"
              }
            ]
          },
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": true
                },
                "renameByName": {
                  "Value #B": "reachable",
                  "Value #C": "write",
                  "Value #D": "raft",
                  "Value #E": "postgres uptime"
                },
                "indexByName": {
                  "node": 0,
                  "kind": 1,
                  "state": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6
                }
              }
            }
          ]
        },
        {
          "type": "table",
          "id": 7,
          "title": "Replication mesh (every node to every node)",
          "description": "bdr.node_slots on each source (slot state, replay lag to target) and bdr.subscription_summary on each target (is it replicating from source).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (source, target, slot_state) (pgd_demo_mesh_slot_info{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "A",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (source, target) (pgd_demo_mesh_slot_active{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "B",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (source, target) (pgd_demo_mesh_lag_bytes{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "C",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (source, target) (pgd_demo_mesh_lag_seconds{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "D",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (source, target, status) (pgd_demo_subscription_replicating{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "E",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "slot"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "streaming": {
                            "text": "streaming",
                            "color": "green",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "regex",
                        "options": {
                          "pattern": ".*",
                          "result": {
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "active"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "yes",
                            "color": "green",
                            "index": 0
                          },
                          "0": {
                            "text": "NO",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "subscription"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
