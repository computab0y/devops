              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - max by (node) (pgd_demo_node_start_time_seconds{cluster=\"$cluster\", group=\"$group\"})",
              "refId": "E",
              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
