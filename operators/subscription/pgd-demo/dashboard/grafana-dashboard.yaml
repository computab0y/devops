            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          },
          "transformations": []
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Raft leader: data group",
