            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true
          },
          "transformations": []
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Write leader",
          "description": "Node the Connection Manager / PGD Proxy routes writes to (bdr.node_group_routing_summary.write_lead).",
