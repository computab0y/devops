              "expr": "max by (node) (pgd_demo_raft_leader{cluster=\"$cluster\", group=\"$group\", scope=\"parent group\"} == 1)",
              "refId": "A",
              "legendFormat": "{{node}}",
              "instant": true,
              "range": false,
              "format": "time_series"
