apiVersion: v1
kind: Service
metadata:
  name: pgd-demo
  labels:
    app: pgd-demo
  annotations:
    # serving cert for the oauth-proxy sidecar (Route reencrypts to it)
    service.beta.openshift.io/serving-cert-secret-name: pgd-demo-proxy-tls
spec:
  selector:
    app: pgd-demo
  ports:
  - name: http          # app itself: scraped by Prometheus (ServiceMonitor), no login
    port: 8080
    targetPort: 8080
  - name: oauth-proxy   # OKD login in front of the app: what the Route exposes
    port: 8443
    targetPort: oauth-proxy
