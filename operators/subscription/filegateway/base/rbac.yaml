apiVersion: v1
kind: ServiceAccount
metadata:
  name: filegw-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filegw-processor
---
# rclone FUSE mounts need /dev/fuse + CAP_SYS_ADMIN -> privileged SCC for the gateway only
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: filegw-gateway-privileged-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
- kind: ServiceAccount
  name: filegw-gateway
