apiVersion: apps/v1
kind: Deployment
metadata:
  name: filegw-gateway
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"filegw-gateway:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"gateway\")].image"}]'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filegw-gateway
  template:
    metadata:
      labels:
        app: filegw-gateway
    spec:
      serviceAccountName: filegw-gateway
      automountServiceAccountToken: false
      containers:
      - name: gateway
        image: image-registry.openshift-image-registry.svc:5000/filegateway/filegw-gateway:latest
        command: ["/bin/sh", "/config/entrypoint.sh"]
        env:
        - name: SFTP_USER
          value: ray
        envFrom:
        - configMapRef:
            name: filegateway
        - secretRef:
            name: filegateway
        ports:
        - name: ssh
          containerPort: 22
        securityContext:
          privileged: true
        # sshd starts only after every user's S3 folders are mounted
        startupProbe:
          tcpSocket:
            port: ssh
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: ssh
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/sh", "/config/healthcheck.sh"]
          periodSeconds: 30
          timeoutSeconds: 10
        # About 30Mi per rclone mount, two mounts per user
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: users
          mountPath: /users
          readOnly: true
        - name: hostkeys
          mountPath: /hostkeys
        - name: cache
          mountPath: /cache
      volumes:
      - name: config
        configMap:
          name: filegw-gateway-config
      # Created by scripts/provision-users.sh; holds password hashes and is not in git
      - name: users
        secret:
          secretName: filegw-users
          defaultMode: 0400
          optional: true
      - name: hostkeys
        secret:
          secretName: filegw-hostkeys
          optional: true
      - name: cache
        emptyDir:
          sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: filegw-sftp
spec:
  type: NodePort
  selector:
    app: filegw-gateway
  ports:
  - name: ssh
    port: 22
    targetPort: ssh
    nodePort: 30022
