apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: open-telemetry
  namespace: open-telemetry
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # opentelemetry-operator.v0.154.0 (the version that actually resolves from the
  # community catalog) only supports the AllNamespaces install mode, not OwnNamespace -
  # targetNamespaces must be empty or CSV install fails with
  # "OwnNamespace InstallModeType not supported".
  targetNamespaces: []