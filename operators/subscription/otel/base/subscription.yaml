# NOTE: this file previously contained a hand-vendored ClusterServiceVersion
# (opentelemetry-operator.v0.59.0, pointing at a private jfrog mirror) despite being
# named/kustomized as a Subscription. That CSV can't resolve on a normal cluster and
# was replaced with a real Subscription against the actual catalog.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-operator
  namespace: open-telemetry
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  channel: alpha
  installPlanApproval: Automatic
  name: opentelemetry-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
