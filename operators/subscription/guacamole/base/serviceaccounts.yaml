# Dedicated ServiceAccounts per component (rather than reusing "default") so the SCC
# grants below are as narrow as possible - only guacd's pod (which carries the
# Tailscale sidecar) gets NET_ADMIN/NET_RAW; postgres and filebrowser separately get
# anyuid (their upstream images aren't built for OpenShift's arbitrary-UID model);
# guacamole and nginx need neither and just use "default".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guacd
  namespace: guacamole
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guacamole-postgres
  namespace: guacamole
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guacamole-filebrowser
  namespace: guacamole
