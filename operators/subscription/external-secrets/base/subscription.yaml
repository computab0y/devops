apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-external-secrets-operator
  namespace: openshift-external-secrets-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # NOTE: the Red Hat productized package "openshift-external-secrets-operator" was not present
  # in the redhat-operators catalog at deploy time on this cluster; the community package below
  # is what actually resolves. If your catalog carries the RH package, switch source back to
  # redhat-operators / name openshift-external-secrets-operator / channel stable-v1.1.
  channel: alpha
  installPlanApproval: Automatic
  name: external-secrets-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
