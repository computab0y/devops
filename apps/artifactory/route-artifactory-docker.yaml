apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/timeout: 10m
  name: artifactory-docker
spec:
  host: artifactory-artifactory.apps.okd.funky-bash.com
  path: /v2
  port:
    targetPort: 8082
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: artifactory
