apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oauth2-proxy
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
      - args:
        - --provider=keycloak-oidc
        - --oidc-issuer-url=https://keycloak-keycloak.apps.okd.funky-bash.com/realms/openshift
        - --provider-ca-file=/etc/keycloak-ca/ca.crt
        - --redirect-url=https://artifactory-artifactory.apps.okd.funky-bash.com/oauth2/callback
        - --upstream=http://artifactory.artifactory.svc.cluster.local:8082/
        - --upstream-timeout=600s
        - --http-address=0.0.0.0:4180
        - --reverse-proxy=true
        - --pass-host-header=true
        - --pass-basic-auth=false
        - --pass-user-headers=false
        - --email-domain=*
        - --insecure-oidc-allow-unverified-email=true
        - --code-challenge-method=S256
        - --skip-provider-button=true
        - --cookie-secure=true
        - --cookie-name=_artifactory_oauth2
        - --silence-ping-logging=true
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: client-id
              name: oauth2-proxy
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: client-secret
              name: oauth2-proxy
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: cookie-secret
              name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /ping
            port: http
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/keycloak-ca
          name: keycloak-ca
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: keycloak-ca
        name: keycloak-ca
