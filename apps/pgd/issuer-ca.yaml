apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: homelab-pgd-ca-issuer
spec:
  ca:
    secretName: homelab-pgd-ca-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-pgd-ca-cert
spec:
  commonName: homelab-pgd-ca
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: homelab-pgd-selfsigned-issuer
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: homelab-pgd-ca-cert
