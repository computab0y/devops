apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: headscale-admin
  name: headscale-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headscale-admin
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: headscale-admin
    spec:
      containers:
      - env:
        - name: PORT
          value: '8080'
        image: docker.io/goodieshq/headscale-admin:0.24
        name: headscale-admin
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: true
