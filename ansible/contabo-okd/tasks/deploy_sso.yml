---
# Deploys operators/subscription/sso (Postgres + Keycloak operator + the "openshift"
# realm import) and wires up the OpenShift OAuth OpenID identity provider. This needs
# more choreography than a plain operator because:
#   - this cluster has no StorageClass/CSI provisioner at all, so Postgres's PVC needs a
#     manually-created hostPath PersistentVolume (and that hostPath needs an SELinux
#     relabel, or the Postgres container gets "Permission denied" despite 0777 perms)
#   - the Keycloak "openshift" client's secret is generated by Keycloak itself on
#     import, so it has to be fetched via the Admin REST API after the realm import
#     finishes, then stored as the openshift-config/keycloak-client-secret secret that
#     sso/overlay/env/openshift-oauth-patch.yaml's OAuth config references
#   - the CA bundle for the OAuth OpenID issuer is the cluster's default ingress CA
#     (the Keycloak route rides on the same wildcard router cert as everything else
#     under *.apps.<domain>), copied into openshift-config/keycloak-ca-bundle

- name: "sso: first apply pass (namespace/OperatorGroup/Subscription/Postgres/OAuth/cluster-admin-binding)"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    oc apply -k {{ repo_url }}//operators/subscription/sso/overlay/env?ref={{ repo_ref }}
  register: sso_apply1
  failed_when: false
  changed_when: "'unchanged' not in sso_apply1.stdout"

- name: "sso: wait for keycloak-operator Subscription InstallPlanRef"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get subscription keycloak-operator -n keycloak -o jsonpath={.status.installPlanRef.name}
  register: sso_install_plan_ref
  until: sso_install_plan_ref.stdout | length > 0
  retries: 30
  delay: 10
  changed_when: false

- name: "sso: get currentCSV"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get subscription keycloak-operator -n keycloak -o jsonpath={.status.currentCSV}
  register: sso_current_csv
  until: sso_current_csv.stdout | length > 0
  retries: 18
  delay: 10
  changed_when: false

- name: "sso: wait for keycloak-operator CSV to reach Succeeded"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get csv {{ sso_current_csv.stdout }} -n keycloak -o jsonpath={.status.phase}
  register: sso_csv_phase
  until: sso_csv_phase.stdout == "Succeeded"
  retries: 30
  delay: 20
  changed_when: false

# --- static storage for Postgres (no CSI provisioner on this cluster) ---

- name: "sso: create hostPath directory for Postgres data on the node"
  become: true
  file:
    path: "{{ postgres_hostpath_dir }}"
    state: directory
    mode: "0777"

- name: "sso: relabel hostPath directory for container access (SELinux)"
  become: true
  command: chcon -Rt container_file_t {{ postgres_hostpath_dir }}
  changed_when: true

- name: "sso: create static PersistentVolume for Postgres"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: postgres-keycloak-pv
      spec:
        capacity:
          storage: 1Gi
        accessModes:
          - ReadWriteOnce
        persistentVolumeReclaimPolicy: Retain
        hostPath:
          path: {{ postgres_hostpath_dir }}
        claimRef:
          name: postgres-pvc
          namespace: keycloak

# --- second pass now that the Keycloak/KeycloakRealmImport CRDs exist ---

- name: "sso: second apply pass (Keycloak instance + realm import CRs)"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    oc apply -k {{ repo_url }}//operators/subscription/sso/overlay/env?ref={{ repo_ref }}
  register: sso_apply2
  changed_when: "'unchanged' not in sso_apply2.stdout"

- name: "sso: wait for Postgres pod to be Running (may need a restart to pick up the SELinux-relabeled volume)"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get pods -n keycloak -l app=postgres -o jsonpath={.items[0].status.phase}
  register: postgres_phase
  until: postgres_phase.stdout == "Running"
  retries: 20
  delay: 10
  changed_when: false
  failed_when: false

- name: "sso: restart Postgres pod if it crash-looped before the PV/SELinux fix landed"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc delete pod -n keycloak -l app=postgres
  when: postgres_phase.stdout != "Running"
  changed_when: true

- name: "sso: wait for Keycloak CR Ready condition"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    oc get keycloak keycloak -n keycloak
    -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: keycloak_ready
  until: keycloak_ready.stdout == "True"
  retries: 30
  delay: 15
  changed_when: false

- name: "sso: wait for KeycloakRealmImport Done condition"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    oc get keycloakrealmimport openshift-realm -n keycloak
    -o jsonpath={.status.conditions[?(@.type=="Done")].status}
  register: realm_done
  until: realm_done.stdout == "True"
  retries: 20
  delay: 15
  changed_when: false

# --- extract the Keycloak-generated client secret + cluster ingress CA, wire into OAuth ---

- name: "sso: read Keycloak temp-admin credentials"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get secret keycloak-initial-admin -n keycloak -o jsonpath={.data.username}
  register: kc_admin_user_b64
  changed_when: false

- name: "sso: read Keycloak temp-admin password"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get secret keycloak-initial-admin -n keycloak -o jsonpath={.data.password}
  register: kc_admin_pass_b64
  changed_when: false

- name: "sso: launch a throwaway curl pod to talk to the Keycloak admin API"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: >
    oc run sso-secret-extract --image=curlimages/curl:8.10.1 -n keycloak
    --restart=Never --command -- sleep 300
  changed_when: true
  failed_when: false

- name: "sso: wait for the curl pod to be ready"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get pod sso-secret-extract -n keycloak -o jsonpath={.status.phase}
  register: curl_pod_phase
  until: curl_pod_phase.stdout == "Running"
  retries: 15
  delay: 4
  changed_when: false

- name: "sso: fetch an admin access token"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: >
    oc exec -n keycloak sso-secret-extract -- curl -s -X POST
    http://keycloak-service:8080/realms/master/protocol/openid-connect/token
    -d grant_type=password -d client_id=admin-cli
    -d username={{ kc_admin_user_b64.stdout | b64decode }}
    -d password={{ kc_admin_pass_b64.stdout | b64decode }}
  register: kc_token_raw
  changed_when: false
  no_log: true

- name: "sso: parse access token"
  set_fact:
    kc_access_token: "{{ (kc_token_raw.stdout | from_json).access_token }}"
  no_log: true

- name: "sso: fetch the openshift client (includes its generated secret)"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: >
    oc exec -n keycloak sso-secret-extract -- curl -s
    -H "Authorization: Bearer {{ kc_access_token }}"
    "http://keycloak-service:8080/admin/realms/openshift/clients?clientId=openshift"
  register: kc_clients_raw
  changed_when: false
  no_log: true

- name: "sso: parse client secret"
  set_fact:
    kc_client_secret: "{{ (kc_clients_raw.stdout | from_json)[0].secret }}"
  no_log: true

- name: "sso: remove the throwaway curl pod"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc delete pod sso-secret-extract -n keycloak --force --grace-period=0
  changed_when: true
  failed_when: false

- name: "sso: create/update openshift-config/keycloak-client-secret"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: >
    oc create secret generic keycloak-client-secret -n openshift-config
    --from-literal=clientSecret={{ kc_client_secret }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true
  no_log: true

- name: "sso: copy the cluster's default ingress CA into openshift-config/keycloak-ca-bundle"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  shell: >
    oc get configmap default-ingress-cert -n openshift-config-managed
    -o jsonpath={.data.ca-bundle\.crt} > /tmp/keycloak-ca.crt &&
    oc create configmap keycloak-ca-bundle -n openshift-config
    --from-file=ca.crt=/tmp/keycloak-ca.crt --dry-run=client -o yaml | oc apply -f -
  changed_when: true

# No need to re-apply openshift-oauth.yaml: the authentication-operator watches the
# secret/configmap it references and rolls a new oauth-server automatically once they
# exist with the right content.

- name: "sso: wait for the authentication clusteroperator to settle"
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  command: oc get clusteroperator authentication -o jsonpath={.status.conditions[?(@.type=="Available")].status}
  register: auth_available
  until: auth_available.stdout == "True"
  retries: 20
  delay: 15
  changed_when: false
