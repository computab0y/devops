# Non-secret defaults for the contabo-okd playbook. Override via -e/--extra-vars or a
# gitignored vars.local.yml (e.g. `ansible-playbook playbook.yml -e @vars.local.yml`).

repo_url: "https://github.com/computab0y/devops"
repo_ref: "main"

# Recovery kubeconfig on the node itself - works from a root shell on the node without
# needing a separately-issued client cert/kubeconfig. Only readable by root, hence
# `become: true` on every oc task.
kubeconfig_path: "/etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/localhost-recovery.kubeconfig"

cluster_apps_domain: "apps.okd.funky-bash.com"

# Local path (on the control machine, i.e. wherever you run ansible-playbook from) to a
# real Red Hat Customer Portal pull secret downloaded from
# https://console.redhat.com/openshift/install/pull-secret. Required for the
# redhat-operators / certified-operators catalogs to pull successfully.
pull_secret_path: "~/Downloads/pull-secret.txt"

# hostPath directory backing Keycloak's Postgres PVC. This cluster has no
# StorageClass/CSI provisioner at all (bare SNO install) so a static PV is used instead.
postgres_hostpath_dir: "/var/lib/local-pvs/postgres-keycloak"

# The 17 real operators from operators/subscription/* that are actually deployed (excludes
# `pipelines`, `test-app` - unused/legacy dirs never part of this deployment - and `vault`,
# which has no OLM subscription at all and is applied separately as a plain operand).
# `sso` and `tekton` are handled by their own dedicated task files further down the
# playbook (they need extra steps interleaved - storage/secret wiring for sso, a
# TektonConfig feature-flag patch for tekton) so they are NOT in this generic list.
# acs (rhacs-operator), amq-streams, istio, jaeger, and kiali were deployed once but
# intentionally removed from this cluster on 2026-07-09 to free up resources on the
# single 8 vCPU/24GB node - none of them were actually in use (no ServiceMeshControlPlane,
# Kafka, or ACS Central ever got configured) and together they were a large share of the
# node's CPU/memory pressure. Re-add entries here (see git history for the exact lines) if
# you actually need service mesh, Kafka, or cluster security scanning later - ideally after
# upsizing the node, since this is exactly the kind of load that caused the outage on
# 2026-07-09 (see PROJECT_STATUS.md).
operators:
  - { name: devworkspaces,              ns: openshift-operators,                  manual_approval: true,  path: overlay/env }
  - { name: edb-postgresql,             ns: openshift-operators,                  manual_approval: true,  path: overlay/env }
  - { name: elasticsearch-eck-operator, ns: openshift-operators,                  manual_approval: true,  path: overlay/env }
  - { name: elasticsearch,              ns: openshift-operators-redhat,           manual_approval: true,  path: overlay/env }
  - { name: external-secrets,           ns: openshift-external-secrets-operator,  manual_approval: false, path: base }
  - { name: gitops,                     ns: openshift-gitops-operator,            manual_approval: false, path: base }
  - { name: grafana,                    ns: grafana-operator,                     manual_approval: false, path: overlay/env }
  - { name: loki,                       ns: openshift-operators-redhat,           manual_approval: false, path: overlay/env }
  - { name: oadp,                       ns: openshift-adp,                        manual_approval: true,  path: overlay/env }
  - { name: openshift-logging,          ns: openshift-logging,                    manual_approval: true,  path: overlay/env }
  - { name: otel,                       ns: open-telemetry,                       manual_approval: false, path: overlay/env }
