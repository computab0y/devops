# Self-managed copy of OKD's default community-operators catalog, polling every 24h
# instead of the default 240m.
#
# Why: the marketplace operator re-pulls the ~1.1GB community-operator-index image on
# every poll, and the image changes often, so each poll left another copy on disk. On
# this single node, kubelet image GC only fires at 85% disk, so ~53 stale copies (~55GB
# apparent, 21GB real) piled up in 9 days. The marketplace operator reverts edits to a
# catalog it owns, so the default source is disabled in operatorhub.yaml and this one
# (same name, so existing Subscriptions keep resolving) replaces it.
#
# Used by: keycloak/keycloak-operator, openshift-external-secrets-operator.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: community-operators
  namespace: openshift-marketplace
spec:
  displayName: Community Operators
  image: registry.access.redhat.com/redhat/community-operator-index:v4.22
  priority: -400
  publisher: Red Hat
  sourceType: grpc
  grpcPodConfig:
    extractContent:
      cacheDir: /tmp/cache
      catalogDir: /configs
    memoryTarget: 120Mi
    nodeSelector:
      kubernetes.io/os: linux
      node-role.kubernetes.io/master: ""
    priorityClassName: system-cluster-critical
    securityContextConfig: restricted
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 120
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 120
  updateStrategy:
    registryPoll:
      interval: 24h
